name: Commit message check

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: commitlint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Validate commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve commit range
        id: range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            FROM="$(git rev-parse "${HEAD_SHA}^" 2>/dev/null || echo "$HEAD_SHA")"
            echo "Không xác định được base commit, kiểm tra commit HEAD."
          else
            FROM="$BASE_SHA"
          fi

          echo "from=$FROM" >> "$GITHUB_OUTPUT"
          echo "to=$HEAD_SHA" >> "$GITHUB_OUTPUT"

          {
            echo "### Commit trong phạm vi kiểm tra"
            echo ""
            git log --format='- `%h` %s' "$FROM..$HEAD_SHA" 2>/dev/null || echo "- (không có commit)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Lint commit messages
        env:
          FROM: ${{ steps.range.outputs.from }}
          TO: ${{ steps.range.outputs.to }}
        run: |
          set -o pipefail

          if ./node_modules/.bin/commitlint --from "$FROM" --to "$TO" --verbose 2>&1 | tee commitlint.log; then
            echo "### ✅ Commit message hợp lệ" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::error title=Commit message không hợp lệ::Sửa theo Conventional Commits: <type>(scope): mô tả. Xem chi tiết trong log của step này."
          {
            echo "### ❌ Commit message không hợp lệ"
            echo ""
            echo "Quy ước: \`<type>(scope): mô tả\` — type: feat, fix, refactor, perf, test, docs, chore, build, ci, revert."
            echo ""
            echo "<details><summary>Chi tiết lỗi commitlint</summary>"
            echo ""
            echo '```text'
            cat commitlint.log
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Lint PR title (dùng cho squash merge)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if printf '%s\n' "$PR_TITLE" | ./node_modules/.bin/commitlint --verbose; then
            echo "### ✅ PR title hợp lệ (squash merge)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::error title=PR title không hợp lệ::Squash merge dùng PR title làm commit message trên main. Sửa title theo Conventional Commits."
          {
            echo "### ❌ PR title không hợp lệ"
            echo ""
            echo "\`$PR_TITLE\`"
            echo ""
            echo "Squash merge dùng PR title làm commit message, nên title cũng phải theo \`<type>(scope): mô tả\`."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
