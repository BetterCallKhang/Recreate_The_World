name: Branch name check

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: branch-name-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  branch-name:
    name: Validate branch name
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read PR source branch
        id: branch
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [ -z "$BRANCH" ]; then
            echo "::error title=Thiếu tên nhánh::Không đọc được github.head_ref."
            exit 1
          fi
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Check branch name
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -o pipefail

          if sh scripts/check-branch-name.sh "$BRANCH" 2>&1 | tee branch-name.log; then
            {
              echo "### ✅ Tên nhánh hợp lệ"
              echo ""
              echo "\`$BRANCH\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::error title=Tên nhánh không hợp lệ::'$BRANCH' không khớp quy ước. Xem docs/coding-conventions.md mục 3.1."
          {
            echo "### ❌ Tên nhánh không hợp lệ"
            echo ""
            echo "\`$BRANCH\`"
            echo ""
            echo "Quy ước: \`main\`, \`release/x.y.z\`, \`<type>/<ten-ngan>\` (chữ thường, gạch ngang)."
            echo ""
            echo '```text'
            cat branch-name.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
